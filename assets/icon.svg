<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Deeper Link mark: a "d" made of a circle linked to a bar; their overlap (the link) is the deepest tone.
       Circle r=34 and bar (width 52) share the baseline y=118. Source of truth for every platform's icons. -->
  <defs>
    <clipPath id="bar"><rect x="60" y="10" width="52" height="108" rx="26"/></clipPath>
  </defs>
  <circle cx="50" cy="84" r="34" fill="#38BDF8"/>
  <rect x="60" y="10" width="52" height="108" rx="26" fill="#2563EB"/>
  <circle cx="50" cy="84" r="34" fill="#172554" clip-path="url(#bar)"/>
</svg>
